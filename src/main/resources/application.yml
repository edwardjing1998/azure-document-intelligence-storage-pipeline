server:
  port: 5555

image-cleaning:
  # Disabled by default. The bundled cleaner targets strongly colored marks.
  enabled: ${IMAGE_CLEANING_ENABLED:false}
  saturation-threshold: ${IMAGE_CLEANING_SATURATION_THRESHOLD:80}
  minimum-brightness: ${IMAGE_CLEANING_MINIMUM_BRIGHTNESS:35}
  radius: ${IMAGE_CLEANING_RADIUS:2}
  # When false, OCR falls back to the original image if cleaning fails.
  fail-on-error: ${IMAGE_CLEANING_FAIL_ON_ERROR:false}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

azure:
  document-intelligence:
    endpoint: ${DOCUMENT_INTELLIGENCE_ENDPOINT:}
    key: ${DOCUMENT_INTELLIGENCE_KEY:}
    api-version: 2024-11-30
    premium-features: ${DOCUMENT_INTELLIGENCE_PREMIUM_FEATURES:false}
    polling-interval-millis: 2000
    maximum-polling-attempts: 30
    maximum-retry-attempts: ${DOCUMENT_INTELLIGENCE_MAXIMUM_RETRY_ATTEMPTS:6}
    default-retry-delay-millis: ${DOCUMENT_INTELLIGENCE_DEFAULT_RETRY_DELAY_MILLIS:2000}
    maximum-retry-delay-millis: ${DOCUMENT_INTELLIGENCE_MAXIMUM_RETRY_DELAY_MILLIS:90000}
  storage:
    endpoint: ${AZURE_STORAGE_ENDPOINT:}
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:documents}
    source-prefix: ${AZURE_STORAGE_SOURCE_PREFIX:source/}
    output-prefix: ${AZURE_STORAGE_OUTPUT_PREFIX:generated/}
