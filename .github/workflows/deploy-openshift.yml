name: Deploy application to OpenShift

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and OpenShift target
        required: true
        type: choice
        options:
          - development
          - qa
          - production
        default: development

permissions:
  contents: read
  packages: write

concurrency:
  group: openshift-document-intelligence-${{ inputs.environment }}
  cancel-in-progress: false

env:
  APP_NAME: azure-document-intelligence-storage-pipeline
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/azure-document-intelligence-storage-pipeline

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Normalize container image name
        shell: bash
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OpenShift ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Normalize container image name
        shell: bash
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Validate GitHub Environment configuration
        shell: bash
        env:
          OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
          OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ vars.DOCUMENT_INTELLIGENCE_ENDPOINT }}
          DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.DOCUMENT_INTELLIGENCE_KEY }}
          AZURE_STORAGE_ENDPOINT: ${{ vars.AZURE_STORAGE_ENDPOINT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          required=(
            OPENSHIFT_SERVER OPENSHIFT_NAMESPACE OPENSHIFT_TOKEN
            GHCR_USERNAME GHCR_PULL_TOKEN
            DOCUMENT_INTELLIGENCE_ENDPOINT DOCUMENT_INTELLIGENCE_KEY
            AZURE_STORAGE_ENDPOINT AZURE_STORAGE_CONTAINER
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment variable or secret: $name"
              exit 1
            fi
          done
          echo "Required configuration is present. Secret values were not displayed."

      - name: Log in to OpenShift
        shell: bash
        env:
          OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
          OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          set -euo pipefail
          oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
          oc project "$OPENSHIFT_NAMESPACE"
          oc whoami

      - name: Configure image pull credentials
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          oc create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Create application ConfigMap
        shell: bash
        env:
          DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ vars.DOCUMENT_INTELLIGENCE_ENDPOINT }}
          AZURE_STORAGE_ENDPOINT: ${{ vars.AZURE_STORAGE_ENDPOINT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_SOURCE_PREFIX: ${{ vars.AZURE_STORAGE_SOURCE_PREFIX }}
          AZURE_STORAGE_OUTPUT_PREFIX: ${{ vars.AZURE_STORAGE_OUTPUT_PREFIX }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          set -euo pipefail
          oc create configmap document-intelligence-runtime-config \
            --from-literal=DOCUMENT_INTELLIGENCE_ENDPOINT="$DOCUMENT_INTELLIGENCE_ENDPOINT" \
            --from-literal=AZURE_STORAGE_ENDPOINT="$AZURE_STORAGE_ENDPOINT" \
            --from-literal=AZURE_STORAGE_CONTAINER="$AZURE_STORAGE_CONTAINER" \
            --from-literal=AZURE_STORAGE_SOURCE_PREFIX="${AZURE_STORAGE_SOURCE_PREFIX:-source/}" \
            --from-literal=AZURE_STORAGE_OUTPUT_PREFIX="${AZURE_STORAGE_OUTPUT_PREFIX:-generated/}" \
            --from-literal=SERVER_PORT="${SERVER_PORT:-8080}" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Create application Secret
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.DOCUMENT_INTELLIGENCE_KEY }}
        run: |
          set -euo pipefail
          oc create secret generic document-intelligence-runtime-secret \
            --from-literal=AZURE_CLIENT_ID="$AZURE_CLIENT_ID" \
            --from-literal=AZURE_TENANT_ID="$AZURE_TENANT_ID" \
            --from-literal=AZURE_CLIENT_SECRET="$AZURE_CLIENT_SECRET" \
            --from-literal=DOCUMENT_INTELLIGENCE_KEY="$DOCUMENT_INTELLIGENCE_KEY" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Apply OpenShift resources
        run: oc apply -f openshift/

      - name: Deploy immutable image
        shell: bash
        run: |
          set -euo pipefail
          oc set image deployment/$APP_NAME \
            "$APP_NAME=$IMAGE_NAME:${{ github.sha }}"
          oc rollout restart deployment/$APP_NAME
          oc rollout status deployment/$APP_NAME --timeout=300s

      - name: Display deployment information
        run: |
          oc get deployment "$APP_NAME"
          oc get pods -l "app=$APP_NAME"
          oc get route "$APP_NAME" \
            -o jsonpath='URL=https://{.spec.host}{"\n"}'

      - name: Log out from OpenShift
        if: always()
        run: oc logout || true
